default: &default
  adapter: postgresql
  encoding: unicode
  host: db
  username: postgres
  password: password
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: uo_app_development

test:
  <<: *default
  database: uo_app_test

production:
  <<: *default
  database: uo_app_production
  username: uo_app
  password: <%= ENV["UO_APP_DATABASE_PASSWORD"] %>